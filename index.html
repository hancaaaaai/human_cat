<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="人貓日記：幫人貓換裝，然後回家過日常，把生活裡的人和事寫進日記。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>人貓換衣間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左邊是可旋轉的 3D 舞台，右邊是貼紙感的衣櫃；手機上改成上下排列 */
:root{
  --bg:#eef0f3;
  --stage:#ffffff;
  --dot:#d5d9e1;
  --surface:#ffffff;
  --ink:#16171b;
  --muted:#686d78;
  --accent:#3155ff;
  --accent-soft:#e3e8ff;
  --on-accent:#ffffff;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317;--stage:#1b1c21;--dot:#2c2e36;--surface:#1f2026;--ink:#f0f0ec;--muted:#9a9ea9;--accent:#8a9dff;--accent-soft:#2a3158;--on-accent:#0f1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121317;--stage:#1b1c21;--dot:#2c2e36;--surface:#1f2026;--ink:#f0f0ec;--muted:#9a9ea9;--accent:#8a9dff;--accent-soft:#2a3158;--on-accent:#0f1020;color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{box-sizing:border-box;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;padding-inline:16px;padding-block:16px}
.stage{position:relative;min-width:0;min-height:0;border:2px solid var(--ink);border-radius:22px;overflow:hidden;
  background:var(--stage) radial-gradient(var(--dot) 1.2px,transparent 1.4px) 0 0/22px 22px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage-head{position:absolute;left:20px;top:16px;pointer-events:none}
.stage-head h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0;letter-spacing:.02em}
.stage-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.views{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px/1 var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip:focus-visible,.tab:focus-visible,.item:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--ink);border-radius:22px;padding:16px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{font:500 14px/1 var(--display);color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:12px;padding:10px 2px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .on{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start;padding:2px 5px 6px 2px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;font:500 13px/1.25 var(--body);color:var(--ink);background:var(--surface);
  border:2px solid var(--ink);border-radius:14px;padding:6px 4px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;min-width:0}
.item:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.item[aria-pressed="true"]{background:var(--accent-soft)}
.item span{text-align:center;overflow-wrap:anywhere}
.item.pose{padding:14px 6px;gap:4px;justify-content:center;min-height:86px}
.item.pose b{font:400 20px/1.1 var(--display)}
.item.pose small{color:var(--muted);font-size:11.5px;font-weight:400}
.busy{position:absolute;top:18px;right:18px;font-size:13px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:6px 12px}
.thumb{width:100%;max-width:92px;aspect-ratio:1;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.ph{width:40%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--a)}
.ph.none{background:linear-gradient(135deg,transparent 46%,var(--ink) 46% 54%,transparent 54%)}
.outfit{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.outfit span{font-size:12px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px}
.outfit .empty{border-style:dashed;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:500 15px/1 var(--display);border:2px solid var(--ink);border-radius:14px;padding:13px;cursor:pointer;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}

/* 遊戲模式 */
.btn.play,.btn.snap{grid-column:1 / -1}
.btn:disabled{opacity:.6;cursor:progress}
body.game .app{grid-template-columns:1fr}
body.game .panel,body.game .views,body.game .stage-head{display:none}
body.game .stage{background:#e3eef4;cursor:default}
.gui{position:absolute;inset:0;pointer-events:none;font-family:var(--body);color:#16171b}
.gui > *{pointer-events:auto}
.gui .chip{background:#fff;color:#16171b;border-color:#16171b}
.gui .chip[aria-pressed="false"]{opacity:.55}
.g-top{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none}
.g-top > *{pointer-events:auto}
.g-place{background:#fff;border:2px solid #16171b;border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;box-shadow:3px 3px 0 #16171b}
.g-place b{font:400 22px/1.1 var(--display)}
.g-place span{font-size:12.5px;color:#585c66;font-variant-numeric:tabular-nums}
.g-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.g-exit{background:#3155ff!important;color:#fff!important}
kbd{font:600 11px/1 ui-monospace,monospace;border:1.5px solid currentColor;border-radius:5px;padding:2px 4px;margin-left:2px}
.g-inv{position:absolute;left:14px;top:92px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.g-inv span{background:#fff;border:1.5px solid #16171b;border-radius:999px;padding:2px 10px;font-size:12.5px;width:max-content}
.g-quests{position:absolute;right:14px;top:64px;width:min(330px,calc(100% - 28px));background:#fff;border:2px solid #16171b;border-radius:16px;padding:12px 14px;box-shadow:4px 4px 0 #16171b}
.g-quests h3{margin:0 0 6px;font:400 19px/1.2 var(--display)}
.g-quests h3 small{font:400 12px var(--body);color:#585c66;margin-left:6px}
.g-quests .q{margin:6px 0;font-size:14px;line-height:1.35}
.g-quests .q b{display:inline-block;width:18px}
.g-quests .q small{display:block;margin-left:18px;color:#585c66;font-size:12px}
.g-quests .q2{color:#585c66;text-decoration:line-through}
.g-bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;left:0;top:0;background:#fff;border:2px solid #16171b;border-radius:14px;padding:4px 10px;font-size:13px;white-space:nowrap;transition:opacity .3s}
.emote{position:absolute;left:0;top:0;font:700 30px/1 var(--display);color:#e0566b;text-shadow:0 0 3px #fff;margin:-15px 0 0 -10px}
.g-prompt{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font:500 15px/1 var(--body);background:#fff;color:#16171b;border:2px solid #16171b;border-radius:999px;padding:9px 16px;box-shadow:3px 3px 0 #16171b;cursor:pointer;white-space:nowrap}
.g-prompt.bite{background:#f2c230;animation:shake .15s infinite alternate}
@keyframes shake{to{transform:translateX(-50%) rotate(3deg) scale(1.08)}}
.g-toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:#16171b;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;white-space:nowrap;pointer-events:none}
.g-dlg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px,calc(100% - 28px));background:#fff;border:2px solid #16171b;border-radius:18px;padding:16px 18px 10px;box-shadow:4px 4px 0 #16171b;cursor:pointer}
.g-dlg-name{position:absolute;top:-16px;left:16px;background:#f2c230;border:2px solid #16171b;border-radius:10px;padding:3px 12px;font:400 17px/1.2 var(--display)}
.g-dlg p{margin:6px 0 8px;font-size:16.5px;line-height:1.55;min-height:3.1em}
.g-dlg small{color:#7a7e88;font-size:11.5px}
.g-dlg-ch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.choice{font:500 14px/1 var(--body);background:#eef2ff;color:#16171b;border:2px solid #16171b;border-radius:12px;padding:9px 13px;cursor:pointer}
.choice:hover{background:#dbe3ff}
.g-joy{position:absolute;left:22px;bottom:22px;width:118px;height:118px;border-radius:50%;border:2px solid #16171b;background:rgba(255,255,255,.7);touch-action:none;display:none}
.g-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;border:2px solid #16171b;box-shadow:2px 2px 0 #16171b}
.g-act{position:absolute;right:22px;bottom:30px;width:86px;height:86px;border-radius:50%;border:2px solid #16171b;background:#f2c230;color:#16171b;font:400 18px var(--display);box-shadow:3px 3px 0 #16171b;display:none}
.g-act:disabled{background:#fff;opacity:.6}
.g-fade{position:absolute;inset:0;background:#0d0e12;opacity:0;transition:opacity .6s;pointer-events:none}
.g-fade.on{opacity:1}
.g-fade{z-index:5}.g-dlg{z-index:6}
.g-fade.scene::after{content:attr(data-label);position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);color:#fff;font:400 34px var(--display);white-space:nowrap}
.g-dlg.narr p{color:#585c66;font-style:italic}
.g-mirror{position:absolute;inset:10px;border:14px solid #d9b98a;border-radius:46% 46% 18px 18px/30% 30% 18px 18px;box-shadow:inset 0 0 0 3px #16171b,0 0 0 3px #16171b,inset 0 0 60px rgba(160,210,240,.45);pointer-events:none}
.g-modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(22,23,27,.35);padding:14px}
.g-x{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;border:2px solid #16171b;background:#fff;font:700 18px/1 var(--body);cursor:pointer}
.g-book{position:relative;width:min(720px,100%);max-height:calc(100% - 10px);overflow:auto;display:grid;grid-template-columns:200px 1fr;background:#fffaf0;border:2px solid #16171b;border-radius:18px;box-shadow:5px 5px 0 #16171b}
.g-dlist{display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:#f4ead8;border-right:2px dashed #c9b28e;border-radius:16px 0 0 16px}
.d-tab{text-align:left;font:500 14.5px/1.3 var(--body);background:#fff;border:2px solid #16171b;border-radius:12px;padding:7px 10px;cursor:pointer;color:#16171b}
.d-tab small{display:block;font-size:11px;color:#7a7e88}
.d-tab.on{background:#f2c230}
.d-tab.locked{color:#9a9ea8;border-style:dashed}
.g-dpage{padding:22px 24px 24px;min-height:300px}
.g-dpage h3{margin:0 0 8px;font:400 26px/1.2 var(--display)}
.g-dpage h3 small{font:500 13px var(--body);color:#7a7e88;margin-left:6px}
.g-dpage dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0}
.g-dpage dt{color:#7a7e88;font-size:13px;padding-top:2px}
.g-dpage dd{margin:0;font-size:15px;line-height:1.5}
.d-lead{font-size:15.5px;line-height:1.6;margin:4px 0}
.d-date{margin:0 0 2px;font:700 13px var(--body);color:#d9453a;letter-spacing:.06em}
.d-text{font-size:16px;line-height:1.75;background:repeating-linear-gradient(#fffaf0 0 27px,#e8dcc6 27px 28px);padding:0 2px;margin:10px 0}
.d-mood{display:inline-block;background:#fde3ea;border:2px solid #16171b;border-radius:999px;padding:4px 12px;font-size:14px}
.d-chip{display:inline-block;background:#fff;border:1.5px solid #16171b;border-radius:999px;padding:1px 9px;margin:0 4px 4px 0;font-size:13.5px}
.g-pcbox{position:relative;background:#2b2c31;border:2px solid #16171b;border-radius:18px;padding:10px 12px 8px;box-shadow:5px 5px 0 #16171b;color:#fff;width:min(392px,100%)}
.g-pchead{display:flex;align-items:center;justify-content:space-between;height:34px;margin-bottom:8px}
.g-pchead b{font:400 18px var(--display)}
.g-pcbox .g-x{position:static}
.g-pcbox canvas{display:block;position:static!important;inset:auto;width:100%!important;height:auto!important;max-height:calc(100svh - 170px);object-fit:contain;border-radius:8px;background:#fff6ec;touch-action:none;cursor:pointer}
.g-pcbox p{margin:6px 0 0;font-size:12px;color:#c9ccd3;text-align:center}
@media (max-width:620px){.g-book{grid-template-columns:1fr}.g-dlist{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px dashed #c9b28e;border-radius:16px 16px 0 0}.d-tab{flex:1 1 40%}}
@media (max-width:700px){.g-toast{top:150px;white-space:normal;max-width:calc(100% - 40px);text-align:center}}
@media (pointer:coarse),(max-width:700px){.g-joy,.g-act{display:block}.g-prompt{bottom:150px}.g-dlg{bottom:150px}}
@media (max-width:860px){body.game .stage{height:calc(100svh - 32px)}}
@media (max-width:860px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:64svh;min-height:430px}
  .items{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="人貓 3D 預覽">
    <div class="stage-head">
      <h1>人貓換衣間</h1>
      <p>拖曳可以轉動人貓</p>
    </div>
    <div class="busy" id="busy" hidden>換動作中…</div>
    <div class="views" role="group" aria-label="視角">
      <button class="chip" id="v-front" data-a="0">正面</button>
      <button class="chip" id="v-side" data-a="-1.5708">側面</button>
      <button class="chip" id="v-back" data-a="3.1416">背面</button>
      <button class="chip" id="v-spin" aria-pressed="false">自動轉</button>
      <button class="chip" id="v-live" aria-pressed="true">晃動</button>
      <button class="chip" id="v-boil" aria-pressed="true">線條抖動</button>
    </div>
    <div class="gui" id="game-ui" hidden>
      <div class="g-top">
        <div class="g-place"><b id="g-place">善美的房間</b><span>日記 <b id="g-pages">0</b> 頁</span></div>
        <div class="g-btns">
          <button class="chip" id="g-dbtn">日記 <kbd>J</kbd></button>
          <button class="chip" id="g-qbtn">今天 <kbd>Q</kbd></button>
          <button class="chip" id="g-snd" aria-pressed="true">音效</button>
          <button class="chip g-exit" id="g-exit">回換衣間</button>
        </div>
      </div>
      <div class="g-inv" id="g-inv"></div>
      <div class="g-quests" id="g-quests" hidden></div>
      <div class="g-bubbles" id="g-bubbles"></div>
      <button class="g-prompt" id="g-prompt" hidden><kbd>E</kbd><b></b></button>
      <div class="g-toast" id="g-toast" role="status" hidden></div>
      <div class="g-dlg" id="g-dlg" hidden>
        <div class="g-dlg-name" id="g-dlg-name"></div>
        <p id="g-dlg-text"></p>
        <div class="g-dlg-ch" id="g-dlg-ch"></div>
        <small>點一下或按 E 繼續</small>
      </div>
      <div class="g-joy" id="g-joy" aria-label="移動搖桿"><div class="g-knob" id="g-knob"></div></div>
      <button class="g-act" id="g-act">互動</button>
      <div class="g-mirror" id="g-mirror" hidden></div>
      <div class="g-modal" id="g-diary" hidden>
        <div class="g-book" role="dialog" aria-label="日記">
          <button class="g-x" id="g-dx" aria-label="關閉">×</button>
          <nav class="g-dlist" id="g-dlist"></nav>
          <article class="g-dpage" id="g-dpage"></article>
        </div>
      </div>
      <div class="g-modal" id="g-pc" hidden>
        <div class="g-pcbox" role="dialog" aria-label="電腦">
          <div class="g-pchead"><b>人貓 OS</b><button class="g-x" id="g-pcx" aria-label="關電腦">×</button></div>
          <canvas id="g-pccv" width="360" height="440"></canvas>
          <p>← → / A D 或用手指拖曳移動・Esc 關電腦</p>
        </div>
      </div>
      <div class="g-fade" id="g-fade"></div>
    </div>
  </section>

  <aside class="panel">
    <p class="label">衣櫃分類</p>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="items" id="items"></div>
    <p class="label">目前穿搭</p>
    <div class="outfit" id="outfit"></div>
    <div class="actions">
      <button class="btn" id="random">隨機搭配</button>
      <button class="btn" id="clear">全部脫掉</button>
      <button class="btn snap" id="snap">下載 PNG 圖檔</button>
      <button class="btn primary play" id="play">穿這樣回家 →</button>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const T = THREE, V = T.Vector3, PI = Math.PI;
const f = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const X = new V(1, 0, 0), Z = new V(0, 0, 1);
let LODF = 1; // 細緻度：遠景和 NPC 用比較少的面
function half(F, nx, ny, nz) { const n2 = [Math.ceil(nx / 2), Math.ceil(ny / 2), Math.ceil(nz / 2)], F2 = new Float32Array(n2[0] * n2[1] * n2[2]); let q = 0; for (let j = 0; j < n2[1]; j++) for (let k = 0; k < n2[2]; k++) for (let i = 0; i < n2[0]; i++) F2[q++] = F[Math.min(i * 2, nx - 1) + nx * (Math.min(k * 2, nz - 1) + nz * Math.min(j * 2, ny - 1))]; return { F2, n2 }; }

/* ---------- 雜訊（讓線條和外形有手繪感） ---------- */
function hash3(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
function noise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const c = (a, b, d) => hash3(ix + a, iy + b, iz + d);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), fx), lerp(c(0, 1, 0), c(1, 1, 0), fx), fy),
              lerp(lerp(c(0, 0, 1), c(1, 0, 1), fx), lerp(c(0, 1, 1), c(1, 1, 1), fx), fy), fz);
}
const AMP = 0.02, WFR = 1.5;
const wob = (x, y, z) => AMP * (2 * noise3(x * WFR + 3.1, y * WFR, z * WFR) - 1);

/* ---------- 渲染 ---------- */
const stage = document.getElementById('stage');
const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
stage.prepend(renderer.domElement);

function beadsG(ctx, mats, r, sag, n, geoFn) {
  const g = new T.Group(), c = chainC(ctx, r, sag), geo = geoFn ? geoFn(r) : sph(r);
  c.getSpacedPoints(n).slice(0, n).forEach((p, i) => g.add(at(mk(geo, mats[i % mats.length]), p.x, p.y, p.z)));

}

  LIGHTS.a.intensity = night ? 0.5 : 0.84; LIGHTS.a.color.set(night ? '#aab4e8' : '#ffffff');

  const pages = [{ key: 'me', title: '關於我', tag: '我' }];

  DIARY.events.forEach(e => pages.push({ key: 'ev:' + e.id, title: e.title, tag: e.date ? e.date.slice(5).replace('-', '/') : (e.tag || ''), locked: !SAVE.diary.includes(e.id) }));
  return pages;
}
function renderDiary() {

  } else if (pg.key.startsWith('p:')) {

    html = `<h3>${esc(p.name)} <small>${esc(p.rel)}</small></h3><dl>${(p.info || []).map(([k, v]) => row(k, esc(v))).join('')}${row('常說', says.map(c => `<span class="d-chip">${esc(c)}</span>`).join(''))}</dl>`;

/* ---------- 電腦：接冰淇淋小遊戲 ---------- */
const PC = { on: false, run: false, t: 0, score: 0, x: 180, tx: null, items: [], spawn: 0, stack: [], flash: 0, flashTxt: '', result: null };
const PCX = hud.pcv.getContext('2d'), PW = 360, PH = 440;
function openPC() { PC.on = true; PC.run = false; PC.result = null; hud.pc.hidden = false; pcDraw(); }
function closePC() { PC.on = false; PC.run = false; hud.pc.hidden = true; standUp(); }
function pcStart() { Object.assign(PC, { run: true, t: 30, score: 0, x: 180, tx: null, items: [], spawn: 0.3, stack: [], flash: 0, result: null }); sfx('pick'); }
function pcUpdate(dt) {
  if (PC.run) {
    const dir = (KEYS.d || KEYS.arrowright ? 1 : 0) - (KEYS.a || KEYS.arrowleft ? 1 : 0);
    if (dir) { PC.x += dir * 320 * dt; PC.tx = null; } else if (PC.tx != null) PC.x += (PC.tx - PC.x) * Math.min(1, dt * 14);
    PC.x = clamp(PC.x, 28, PW - 28);
    const el = 30 - PC.t;
    PC.spawn -= dt;
    if (PC.spawn <= 0) { PC.spawn = 0.62 - Math.min(0.3, el * 0.011); PC.items.push({ x: 24 + Math.random() * (PW - 48), y: -24, vy: 130 + el * 6 + Math.random() * 60, bad: Math.random() < 0.22, c: SCOOPS[Math.floor(Math.random() * SCOOPS.length)] }); }
    for (let i = PC.items.length - 1; i >= 0; i--) {
      const it = PC.items[i]; it.y += it.vy * dt;
      const topY = PH - 70 - Math.min(PC.stack.length, 5) * 20;
      if (it.y > topY - 18 && it.y < topY + 14 && Math.abs(it.x - PC.x) < 30) {
        if (it.bad) { PC.score = Math.max(0, PC.score - 2); PC.stack = []; PC.flash = 0.8; PC.flashTxt = DIARY.me.phrases[0]; sfx('bad'); }
        else { PC.score++; PC.stack.push(it.c); if (PC.stack.length > 6) PC.stack.shift(); sfx('pick'); }
        PC.items.splice(i, 1);
      } else if (it.y > PH + 30) PC.items.splice(i, 1);
    }
    PC.flash = Math.max(0, PC.flash - dt);
    PC.t -= dt;
    if (PC.t <= 0) {
      PC.run = false; const best = PC.score > SAVE.best; if (best) { SAVE.best = PC.score; saveGame(); }
      PC.result = { score: PC.score, best }; best ? jingle() : sfx('yay');
      if (best && PC.score > 0) meSay(DIARY.me.phrases[2] || myPhrase());
    }
  }
  pcDraw();
}
function pcDraw() {
  const x = PCX;
  x.fillStyle = '#fff6ec'; x.fillRect(0, 0, PW, PH);
  x.fillStyle = '#fdeadf'; for (let i = 0; i < 6; i++) x.fillRect(i * 60, 0, 30, PH);
  x.fillStyle = '#e9d6b9'; x.fillRect(0, PH - 22, PW, 22);
  for (const it of PC.items) {
    x.lineWidth = 3; x.strokeStyle = '#16171b';
    if (it.bad) { x.fillStyle = '#5f9d5a'; x.fillRect(it.x - 5, it.y, 10, 18); x.strokeRect(it.x - 5, it.y, 10, 18); for (const [dx, dy] of [[-10, -4], [10, -4], [0, -12], [0, 0]]) { x.fillStyle = '#7fb36f'; x.beginPath(); x.arc(it.x + dx, it.y + dy, 10, 0, 7); x.fill(); x.stroke(); } }
    else { x.fillStyle = it.c; x.beginPath(); x.arc(it.x, it.y, 16, 0, 7); x.fill(); x.stroke(); }
  }
  drawCone(x, PC.x, PH - 70, 1, PC.stack.slice(-5));
  x.fillStyle = '#16171b'; x.font = '700 18px sans-serif'; x.textAlign = 'left'; x.fillText(`${PC.score} 球`, 12, 26);
  x.textAlign = 'right'; x.fillText(PC.run ? `${Math.ceil(PC.t)} 秒` : `最高 ${SAVE.best}`, PW - 12, 26);
  if (PC.flash > 0) { x.textAlign = 'center'; x.font = '700 34px sans-serif'; x.fillStyle = '#d9453a'; x.fillText(PC.flashTxt, PW / 2, PH / 2); }
  if (!PC.run) {
    x.fillStyle = 'rgba(255,255,255,.88)'; x.fillRect(30, 130, PW - 60, 170); x.strokeStyle = '#16171b'; x.lineWidth = 3; x.strokeRect(30, 130, PW - 60, 170);
    x.fillStyle = '#16171b'; x.textAlign = 'center'; x.font = '700 26px sans-serif';
    if (PC.result) { x.fillText(`接到 ${PC.result.score} 球！`, PW / 2, 178); x.font = '500 16px sans-serif'; x.fillText(PC.result.best ? '新紀錄！' : `最高紀錄 ${SAVE.best} 球`, PW / 2, 208); }
    else { x.fillText('接冰淇淋', PW / 2, 178); x.font = '500 15px sans-serif'; x.fillText('30 秒內盡量接，別接到花椰菜', PW / 2, 208); }
    x.font = '700 16px sans-serif'; x.fillText(PC.result ? '點一下或按空白鍵再玩一次' : '點一下或按空白鍵開始', PW / 2, 262);
  }
}

const KEYS = {};
const gameCam = new T.PerspectiveCamera(48, 1, 0.5, 600);
const JOY = { on: false, x: 0, y: 0, id: null };
addEventListener('keydown', e => {
  if (!GAME.on) return;
  const k = e.key.toLowerCase(); KEYS[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'escape') { if (PC.on) closePC(); else if (DIA.open) closeDiary(); else if (GAME.mirror) endMirror(); else if (DLG.open) closeDialog(); return; }
  if (PC.on) { if ((k === ' ' || k === 'enter' || k === 'e') && !PC.run) pcStart(); return; }
  if (k === 'j') { DIA.open ? closeDiary() : openDiary(); return; }
  if (DIA.open) { if (k === 'e' || k === 'enter' || k === ' ') closeDiary(); return; }
  if (k === 'e' || k === ' ' || k === 'enter') action();
  if (DLG.open && DLG.choices && /^[1-4]$/.test(k)) pick(+k - 1);
  if (k === 'q') toggleQuests();
});
addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
function action() {
  if (GAME.lock) return;
  if (DIA.open) { closeDiary(); return; }
  if (PC.on) { if (!PC.run) pcStart(); return; }
  if (DLG.open) { if (!DLG.choices || hud.dlgCh.innerHTML === '') nextLine(); return; }
  if (GAME.mirror) { endMirror(); return; }
  if (GAME.sitting) { standUp(); return; }
  const it = GAME.near; if (!it) return;
  if (it.npc) talkTo(it.npc); else it.fn();
}

function joyMove(e) { const r = hud.joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } JOY.x = dx; JOY.y = dy; hud.knob.style.transform = `translate(${dx * 34}px, ${dy * 34}px)`; }
