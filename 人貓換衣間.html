<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>人貓換衣間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左邊是可旋轉的 3D 舞台，右邊是貼紙感的衣櫃；手機上改成上下排列 */
:root{
  --bg:#eef0f3;
  --stage:#ffffff;
  --dot:#d5d9e1;
  --surface:#ffffff;
  --ink:#16171b;
  --muted:#686d78;
  --accent:#3155ff;
  --accent-soft:#e3e8ff;
  --on-accent:#ffffff;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317;--stage:#1b1c21;--dot:#2c2e36;--surface:#1f2026;--ink:#f0f0ec;--muted:#9a9ea9;--accent:#8a9dff;--accent-soft:#2a3158;--on-accent:#0f1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121317;--stage:#1b1c21;--dot:#2c2e36;--surface:#1f2026;--ink:#f0f0ec;--muted:#9a9ea9;--accent:#8a9dff;--accent-soft:#2a3158;--on-accent:#0f1020;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{box-sizing:border-box;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:16px;padding-inline:16px;padding-block:16px}
.stage{position:relative;min-width:0;min-height:0;border:2px solid var(--ink);border-radius:22px;overflow:hidden;
  background:var(--stage) radial-gradient(var(--dot) 1.2px,transparent 1.4px) 0 0/22px 22px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage-head{position:absolute;left:20px;top:16px;pointer-events:none}
.stage-head h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0;letter-spacing:.02em}
.stage-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.views{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px/1 var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip:focus-visible,.tab:focus-visible,.item:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--ink);border-radius:22px;padding:16px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{font:500 14px/1 var(--display);color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:12px;padding:10px 2px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .on{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start;padding:2px 5px 6px 2px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;font:500 13px/1.25 var(--body);color:var(--ink);background:var(--surface);
  border:2px solid var(--ink);border-radius:14px;padding:6px 4px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;min-width:0}
.item:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.item[aria-pressed="true"]{background:var(--accent-soft)}
.item span{text-align:center;overflow-wrap:anywhere}
.item.pose{padding:14px 6px;gap:4px;justify-content:center;min-height:86px}
.item.pose b{font:400 20px/1.1 var(--display)}
.item.pose small{color:var(--muted);font-size:11.5px;font-weight:400}
.busy{position:absolute;top:18px;right:18px;font-size:13px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:6px 12px}
.thumb{width:100%;max-width:92px;aspect-ratio:1;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.ph{width:40%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--a)}
.ph.none{background:linear-gradient(135deg,transparent 46%,var(--ink) 46% 54%,transparent 54%)}
.outfit{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.outfit span{font-size:12px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 9px}
.outfit .empty{border-style:dashed;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:500 15px/1 var(--display);border:2px solid var(--ink);border-radius:14px;padding:13px;cursor:pointer;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}

@media (max-width:860px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:64svh;min-height:430px}
  .items{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>

<div class="app">

      <h1>人貓換衣間</h1>

      <button class="btn primary" id="random">隨機搭配</button>
      <button class="btn" id="clear">全部脫掉</button>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

const CATS = [['hat', '帽子'], ['glasses', '眼鏡'], ['tie', '領帶'], ['neck', '項鍊'], ['top', '衣服'], ['pants', '褲子'], ['gloves', '手套'], ['shoes', '鞋子'], ['pet', '寵物']];
const find = (cat, id) => id ? ITEMS[cat].find(i => i.id === id) : null;

/* ---------- 穿搭層次：每件衣物知道外面有沒有別的衣服 ---------- */
function makeCtx(st) {
  const top = find('top', st.top), pants = find('pants', st.pants), hat = find('hat', st.hat);
  const cov = [top && top.cover, pants && pants.cover].filter(Boolean);
  const legY = pants && pants.leg ? { knee: 1.9, ankle: 0.62, calf: 1.1 }[pants.leg] : 0;
  return {
    surfD: y => cov.reduce((m, c) => y >= c.y0 - 0.05 && y <= c.y1 + 0.05 ? Math.max(m, c.d) : m, 0),
    sleeve: top && top.sleeve || null,
    pleg: legY ? { y1: legY, d: 0.05 } : null,
    hatTop: hat ? hat.top : BY1 + 0.02,
  };
}

const state = { hat: null, glasses: null, tie: null, neck: null, top: null, pants: null, gloves: null, shoes: null, pet: null };
let current = 'pose', bounceT = 9, ticks = [], charLift = 0;
const skinOut = new T.Group(); char.add(skinOut);
const rigidOut = new T.Group(); rigidG.add(rigidOut);
const petRoot = new T.Group(); root.add(petRoot);
base.traverse(m => { m.userData.keep = true; });
const SKIN = new Set(['top', 'pants', 'gloves', 'shoes']);
function rebuildOutfit() {
  clearGroup(skinOut); clearGroup(rigidOut); clearGroup(petRoot); ticks = [];
  applyPose(REST); const ctx = makeCtx(state); let lift = 0;
  for (const [cat] of CATS) {
    const it = find(cat, state[cat]); if (!it) continue;
    try {
      const g = it.build(ctx); if (it.lift) lift = Math.max(lift, it.lift);
      if (cat === 'pet' && !it.onChar) petRoot.add(g);
      else if (SKIN.has(cat)) { skinOut.add(skinify(g, ALL)); disposeTree(g); }
      else rigidOut.add(g);
    } catch (e) { console.error('build failed', cat, it.id, e); }
  }
  bindAll(skinOut);
  [rigidOut, petRoot].forEach(g => g.traverse(o => { if (o.userData.tick) ticks.push(o.userData.tick); }));
  charLift = lift; frameCamera();
}

/* ---------- 縮圖 ---------- */
const thumbR = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
const TS = 168; thumbR.setPixelRatio(1); thumbR.setSize(TS, TS); thumbR.setClearColor(0x000000, 0);
const thumbScene = new T.Scene(); addLights(thumbScene);
const thumbCam = new T.PerspectiveCamera(26, 1, 0.05, 100);
const thumbs = {}, queue = [];
function renderThumb(cat, it) {
  const key = cat + '/' + it.id; if (thumbs[key]) return;
  let g;
  try { g = it.build(Object.assign(makeCtx({}), { thumb: cat === 'gloves' })); } catch (e) { console.error('thumb', key, e); thumbs[key] = 'x'; return; }
  thumbScene.add(g); g.updateMatrixWorld(true);
  const box = new T.Box3().setFromObject(g), c = box.getCenter(new V()), s = box.getSize(new V());
  const r = Math.max(s.x, s.y, s.z * 0.6) * 0.5 + 0.05;
  const dir = new V(0.38, 0.18, 1).normalize(), dist = r / Math.tan(T.MathUtils.degToRad(13)) * 1.08;
  thumbCam.position.copy(c).addScaledVector(dir, dist); thumbCam.lookAt(c); thumbCam.updateProjectionMatrix();
  const u = inkMat.uniforms, pr = u.uRes.value.clone(), pt = u.uThick.value, ps = u.uSeed.value;
  u.uRes.value.set(TS, TS); u.uThick.value = 2.2; u.uSeed.value = 0;
  thumbR.render(thumbScene, thumbCam);
  u.uRes.value.copy(pr); u.uThick.value = pt; u.uSeed.value = ps;
  thumbs[key] = thumbR.domElement.toDataURL('image/png');
  thumbScene.remove(g); if (!g.userData.noDispose) disposeTree(g);
  const img = document.getElementById('th-' + cat + '-' + it.id);
  if (img) img.innerHTML = `<img alt="" src="${thumbs[key]}">`;
}
function queueThumbs(cat) { ITEMS[cat].forEach(it => { if (!thumbs[cat + '/' + it.id]) queue.push([cat, it]); }); }

/* ---------- 介面 ---------- */
const tabsEl = document.getElementById('tabs'), itemsEl = document.getElementById('items'), outfitEl = document.getElementById('outfit');
function renderUI() {
  tabsEl.innerHTML = [['pose', '動作'], ...CATS].map(([id, name]) =>
    `<button class="tab" role="tab" id="tab-${id}" aria-selected="${id === current}" data-cat="${id}">${name}${id !== 'pose' && state[id] ? '<span class="on" aria-hidden="true"></span>' : ''}</button>`).join('');
  outfitEl.innerHTML = `<span>動作：${pose.name}</span>` + CATS.map(([id, name]) => { const it = find(id, state[id]); return it ? `<span>${name}：${it.name}</span>` : ''; }).join('');
  if (current === 'pose') {
    itemsEl.innerHTML = POSES.map(p => `<button class="item pose" id="pose-${p.id}" data-id="${p.id}" aria-pressed="${pose.id === p.id}"><b>${p.name}</b><small>${p.note}</small></button>`).join('');
    return;
  }
  const list = [{ id: null, name: '不穿' }, ...ITEMS[current]];
  itemsEl.innerHTML = list.map(it => {
    const key = current + '/' + it.id, th = it.id ? thumbs[key] : null;
    const inner = !it.id ? '<span class="ph none"></span>' : th && th !== 'x' ? `<img alt="" src="${th}">` : `<span class="ph" style="--a:${it.c}"></span>`;
    return `<button class="item" id="item-${current}-${it.id || 'none'}" data-id="${it.id || ''}" aria-pressed="${state[current] === it.id}"><span class="thumb" id="th-${current}-${it.id || 'none'}">${inner}</span><span>${it.name}</span></button>`;
  }).join('');
  if (!CATS.some(([id]) => state[id])) outfitEl.innerHTML += '<span class="empty">什麼都沒穿，原汁原味的人貓</span>';
  queueThumbs(current);
}
function wear(cat, id) { state[cat] = id; bounceT = 0; renderUI(); rebuildOutfit(); }
tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { current = b.dataset.cat; renderUI(); } });
itemsEl.addEventListener('click', e => { const b = e.target.closest('.item'); if (!b) return; if (current === 'pose') setPose(b.dataset.id); else wear(current, b.dataset.id || null); });
const busyEl = document.getElementById('busy');
function setPose(id) {
  const p = POSES.find(q => q.id === id); if (!p || p === pose) return;
  pose = p; bounceT = 0; renderUI(); frameCamera();
}
document.getElementById('random').onclick = () => {
  for (const [cat] of CATS) { const l = ITEMS[cat]; state[cat] = Math.random() < (cat === 'pet' ? 0.4 : 0.3) ? null : l[Math.floor(Math.random() * l.length)].id; }
  bounceT = 0; renderUI(); rebuildOutfit();
};
document.getElementById('clear').onclick = () => { for (const [cat] of CATS) state[cat] = null; bounceT = 0; renderUI(); rebuildOutfit(); };

/* ---------- 旋轉 ---------- */
let rot = 0.3, target = 0.3, vel = 0, drag = null, spin = false, boil = true;
document.querySelectorAll('.views [data-a]').forEach(b => b.onclick = () => { const a = +b.dataset.a; target = a + Math.round((rot - a) / (PI * 2)) * PI * 2; vel = 0; });
const spinBtn = document.getElementById('v-spin'), boilBtn = document.getElementById('v-boil');
spinBtn.onclick = () => { spin = !spin; spinBtn.setAttribute('aria-pressed', spin); };
boilBtn.onclick = () => { boil = !boil; boilBtn.setAttribute('aria-pressed', boil); };
const liveBtn = document.getElementById('v-live'); liveBtn.onclick = () => { live = !live; liveBtn.setAttribute('aria-pressed', live); };
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX }; vel = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x; drag.x = e.clientX; target += dx * 0.012; vel = dx * 0.012; });
const end = () => { drag = null; };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

/* ---------- 鏡頭 ---------- */
function frameCamera() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  const pet = !!state.pet && !find('pet', state.pet).onChar;
  const t = Math.tan(T.MathUtils.degToRad(14)), aspect = w / h;
  const cx = pose.wide ? (pet ? -0.3 : 0) : pet ? -0.4 : 0.3, half = Math.max(pet ? 4.3 : 3.5, pose.wide ? 4.0 : 0);
  const jump = pose.anim === 'jump', hh = jump ? 5.3 : 4.7, ly = jump ? 4.5 : 3.9;
  const d = Math.max(hh / t, half / (t * aspect));
  camera.aspect = aspect; camera.position.set(cx, ly + 0.5, d); camera.lookAt(cx, ly, 0); camera.updateProjectionMatrix();
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false);
  const pr = renderer.getPixelRatio();
  inkMat.uniforms.uRes.value.set(w * pr, h * pr);
  inkMat.uniforms.uThick.value = 2.8 * pr;
  frameCamera();
}
new ResizeObserver(resize).observe(stage); resize();

/* ---------- 動畫：解骨架角度、平滑過渡、加上晃動 ---------- */
let live = true, jumpY = 0, bobY = 0;
const _q = new T.Quaternion(), _e = new T.Euler(), TQ = {};
boneList.forEach(b => TQ[b.name] = new T.Quaternion());
const fromTo = (a, b) => new T.Quaternion().setFromUnitVectors(a.clone().normalize(), b.clone().normalize());
function solveChain(names, restPts, tgtPts) {
  let parentW = new T.Quaternion();
  for (let i = 0; i < names.length; i++) {
    const rd = new V().subVectors(restPts[i + 1], restPts[i]).applyQuaternion(parentW), td = new V().subVectors(tgtPts[i + 1], tgtPts[i]);
    const w = fromTo(rd, td).multiply(parentW);
    TQ[names[i]].copy(parentW.clone().invert().multiply(w));
    parentW = w;
  }
}
function animate(dt) {
  const t = clock, ph = live ? (t * (SPEED[pose.id] || 1)) % 1 : 0;
  const data = pose.at ? Object.assign({}, pose, pose.at(ph)) : pose;
  for (const k of ['L', 'R']) {
    solveChain(LIMB['arm' + k].names, RP['arm' + k], armPoly(data[k]));
    solveChain(LIMB['leg' + k].names, RP['leg' + k], legPoly((data.legs || LEGS0)[k]));
  }
  const sw = live ? 1 : 0;
  TQ.chest.setFromEuler(_e.set(0.025 * Math.sin(t * 1.1) * sw, 0.03 * Math.sin(t * 0.7) * sw, 0.04 * Math.sin(t * 1.4) * sw));
  TQ.hips.setFromEuler(_e.set(0, 0, -0.015 * Math.sin(t * 1.4) * sw));
  for (const k of ['L', 'R']) TQ['arm' + k + '0'].premultiply(_q.setFromEuler(_e.set(0, 0, 0.05 * Math.sin(t * 1.8 + (k === 'L' ? 0 : 1.3)) * sw)));
  TQ.tail0.setFromEuler(_e.set(0, 0.22 * Math.sin(t * 2.2) * sw, 0.06 * Math.sin(t * 1.5) * sw));
  TQ.tail1.setFromEuler(_e.set(0, 0.3 * Math.sin(t * 2.2 - 0.9) * sw, 0.1 * Math.sin(t * 1.5 - 0.6) * sw));
  const a = 1 - Math.exp(-dt * 7);
  boneList.forEach(b => { if (b !== bones.root) b.quaternion.slerp(TQ[b.name], a); });
  const tb = (pose.dy ? pose.dy(ph) : 0) * sw + 0.03 * Math.sin(t * 2.8) * sw;
  bobY += (tb - bobY) * Math.min(1, dt * 10);
  return bobY;
}
/* ---------- 動畫 ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), nextBlink = 2.5, clock = 0, seedStep = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  if (!drag) { target += vel; vel *= 0.92; if (Math.abs(vel) < 1e-4) vel = 0; }
  if (spin && !drag) target += dt * 0.8;
  rot += (target - rot) * Math.min(1, dt * 10);
  root.rotation.y = rot;
  bounceT += dt;
  const s = reduce ? 0 : Math.sin(bounceT * 22) * Math.exp(-bounceT * 7);
  char.scale.set(1 + 0.04 * s, 1 - 0.06 * s, 1 + 0.04 * s);
  nextBlink -= dt;
  eyesLive.forEach(m => m.scale.y = nextBlink < 0 ? 0.12 : 1);
  if (nextBlink < -0.13) nextBlink = 2 + Math.random() * 3;
  ticks.forEach(fn => fn(clock));
  const dy = animate(dt);
  if (pose.anim === 'jump') { const j = live ? 0.15 + Math.abs(Math.sin(clock * 3.2)) * 0.9 : 0.4; jumpY += (j - jumpY) * Math.min(1, dt * 12); }
  else jumpY += (0 - jumpY) * Math.min(1, dt * 8);
  char.position.y = charLift + dy + jumpY; shadow.scale.set(1 - (dy + jumpY) * 0.3, 0.5 - (dy + jumpY) * 0.15, 1);
  if (boil && !reduce) { const st = Math.floor(clock * 7); if (st !== seedStep) { seedStep = st; inkMat.uniforms.uSeed.value = (st % 4) * 3.7; } }
  else inkMat.uniforms.uSeed.value = 0;
  for (let i = 0; i < 2 && queue.length; i++) { const [c, it] = queue.shift(); renderThumb(c, it); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
renderUI(); rebuildOutfit();
requestAnimationFrame(loop);
</script>
